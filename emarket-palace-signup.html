<title>Inscription commerçant</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: formulaire en une colonne centrée, étapes empilées (compte -> boutique -> confirmation) */
:root{
  --bg:#f7f5f1; --surface:#ffffff; --ink:#1c1a17; --muted:#6b645c;
  --accent:#1f7a5c; --accent-ink:#ffffff; --border:#e4ddd3; --danger:#b3432f;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15130f; --surface:#211e19; --ink:#f2eee6; --muted:#a69d8f;
    --accent:#3fae84; --accent-ink:#0b1410; --border:#352f27; --danger:#e2715c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15130f; --surface:#211e19; --ink:#f2eee6; --muted:#a69d8f;
  --accent:#3fae84; --accent-ink:#0b1410; --border:#352f27; --danger:#e2715c;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); margin:0;
  font-family:"Inter",system-ui,-apple-system,sans-serif;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
.wrap{max-width:460px; margin:0 auto; padding-block:32px 48px; display:flex; flex-direction:column; gap:20px}
h1{font-family:"Space Grotesk",system-ui,sans-serif; font-size:1.5rem; margin:0; text-wrap:balance}
.sub{color:var(--muted); font-size:.92rem; margin-top:4px}
.steps{display:flex; gap:8px; font-size:.78rem; color:var(--muted)}
.step{display:flex; align-items:center; gap:6px}
.dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.7rem;flex:none}
.step.active .dot{border-color:var(--accent); background:var(--accent); color:var(--accent-ink)}
.step.done .dot{border-color:var(--accent); color:var(--accent)}
.card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:22px; display:flex; flex-direction:column; gap:14px}
label{font-size:.82rem; font-weight:600; display:flex; flex-direction:column; gap:6px}
input,select,textarea{
  font:inherit; font-size:.95rem; padding:10px 12px; border-radius:9px;
  border:1px solid var(--border); background:var(--bg); color:var(--ink);
}
textarea{resize:vertical; min-height:72px}
button{
  font:inherit; font-weight:600; font-size:.95rem; padding:12px 16px; border-radius:10px;
  border:none; background:var(--accent); color:var(--accent-ink); cursor:pointer;
}
button:disabled{opacity:.6; cursor:default}
button.ghost{background:transparent; color:var(--muted); border:1px solid var(--border)}
.row{display:flex; gap:10px}
.row > *{flex:1; min-width:0}
.msg{font-size:.85rem; padding:10px 12px; border-radius:9px; border:1px solid var(--border)}
.msg.error{color:var(--danger); border-color:var(--danger)}
.msg.ok{color:var(--accent); border-color:var(--accent)}
.hidden{display:none!important}
.success{display:flex; flex-direction:column; gap:10px; text-align:center; align-items:center; padding:12px 0}
.success .badge{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:1.4rem}
footer{font-size:.78rem; color:var(--muted); text-align:center}
</style>

<div class="wrap">
  <div>
    <h1>Ouvrir ma vitrine</h1>
    <div class="sub">Rejoins eMarket-Palace et mets tes produits devant des acheteurs dès aujourd'hui.</div>
  </div>

  <div class="steps">
    <div class="step" id="step-ind-1"><span class="dot">1</span> Compte</div>
    <div class="step" id="step-ind-2"><span class="dot">2</span> Boutique</div>
    <div class="step" id="step-ind-3"><span class="dot">3</span> Confirmation</div>
  </div>

  <div id="msg-box"></div>

  <form id="form-account" class="card">
    <label>Nom complet
      <input type="text" id="full_name" required placeholder="Ex. Jeanne Kalonji" autocomplete="name">
    </label>
    <label>Adresse email
      <input type="email" id="email" required placeholder="toi@exemple.com" autocomplete="email">
    </label>
    <label>Mot de passe
      <input type="password" id="password" required minlength="6" placeholder="6 caractères minimum" autocomplete="new-password">
    </label>
    <button type="submit" id="btn-account">Créer mon compte</button>
  </form>

  <form id="form-store" class="card hidden">
    <label>Nom de la boutique
      <input type="text" id="store_name" required placeholder="Ex. Chez Jeanne Mode">
    </label>
    <label>Catégorie
      <select id="category" required>
        <option value="" disabled selected>Choisis une catégorie</option>
        <option>Mode &amp; Accessoires</option>
        <option>Électronique</option>
        <option>Alimentation</option>
        <option>Beauté &amp; Soins</option>
        <option>Maison &amp; Déco</option>
        <option>Services</option>
      </select>
    </label>
    <label>Description de la boutique
      <textarea id="description" placeholder="En quelques mots, qu'est-ce que tu vends ?"></textarea>
    </label>
    <div class="row">
      <button type="button" class="ghost" id="btn-skip">Plus tard</button>
      <button type="submit" id="btn-store">Créer ma boutique</button>
    </div>
  </form>

  <div id="panel-done" class="card hidden">
    <div class="success">
      <div class="badge">✓</div>
      <div><strong id="done-title">Boutique créée</strong></div>
      <div class="sub" id="done-sub"></div>
    </div>
  </div>

  <footer>eMarket-Palace &middot; connecté à la base de données en direct</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
  "use strict";
  var SUPABASE_URL = "https://dnwfbnhvxnoyosjuzxxs.supabase.co";
  var SUPABASE_KEY = "sb_publishable_oWWjQGlbhIl7FGsB5cK75w_PlNeDmpf";
  var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var msgBox = document.getElementById("msg-box");
  var formAccount = document.getElementById("form-account");
  var formStore = document.getElementById("form-store");
  var panelDone = document.getElementById("panel-done");
  var btnAccount = document.getElementById("btn-account");
  var btnStore = document.getElementById("btn-store");
  var btnSkip = document.getElementById("btn-skip");

  var currentUserId = null;

  function setStep(n){
    for (var i=1;i<=3;i++){
      var el = document.getElementById("step-ind-"+i);
      el.classList.remove("active","done");
      if (i < n) el.classList.add("done");
      if (i === n) el.classList.add("active");
    }
  }

  function showMsg(text, kind){
    msgBox.innerHTML = "";
    if (!text) return;
    var div = document.createElement("div");
    div.className = "msg " + (kind || "");
    div.textContent = text;
    msgBox.appendChild(div);
  }

  setStep(1);

  formAccount.addEventListener("submit", function(ev){
    ev.preventDefault();
    showMsg("", "");
    var full_name = document.getElementById("full_name").value.trim();
    var email = document.getElementById("email").value.trim();
    var password = document.getElementById("password").value;

    btnAccount.disabled = true;
    btnAccount.textContent = "Création du compte...";

    client.auth.signUp({ email: email, password: password })
      .then(function(res){
        if (res.error) throw res.error;
        var user = res.data && res.data.user;
        if (!user) throw new Error("Compte créé, mais aucune session n'a été retournée.");
        // Supabase renvoie un faux succès (sans erreur explicite) quand l'email
        // a déjà un compte, pour ne pas révéler quels emails sont enregistrés :
        // identities vide = compte déjà existant, pas de session.
        if (user.identities && user.identities.length === 0){
          throw new Error("Cette adresse email a déjà un compte. Connecte-toi plutôt depuis la page \"Espace commerçant\".");
        }
        currentUserId = user.id;
        var hasSession = !!(res.data && res.data.session);

        if (!hasSession){
          // Email de confirmation requis : tant qu'il n'est pas confirmé, il n'y a
          // pas encore de session active, donc toute écriture (profil, boutique)
          // serait bloquée par la sécurité de la base de données. On ne tente pas
          // ces écritures maintenant pour éviter une fausse erreur ; l'utilisateur
          // les terminera après confirmation, depuis la page "Espace commerçant"
          // (qui crée/retente automatiquement le profil à la connexion).
          return "no-session";
        }

        return client.from("profiles").upsert({
          id: user.id,
          full_name: full_name,
          role: "merchant"
        }).then(function(profRes){
          if (profRes.error) throw profRes.error;
          return "session";
        });
      })
      .then(function(outcome){
        if (outcome === "no-session"){
          setStep(3);
          formAccount.classList.add("hidden");
          document.getElementById("done-title").textContent = "Compte créé";
          document.getElementById("done-sub").textContent = "Vérifie ton email pour confirmer ton compte, puis connecte-toi sur la page \"Espace commerçant\" pour créer ta boutique.";
          panelDone.classList.remove("hidden");
          return;
        }
        setStep(2);
        formAccount.classList.add("hidden");
        formStore.classList.remove("hidden");
      })
      .catch(function(err){
        showMsg(translateError(err), "error");
      })
      .finally(function(){
        btnAccount.disabled = false;
        btnAccount.textContent = "Créer mon compte";
      });
  });

  btnSkip.addEventListener("click", function(){
    setStep(3);
    formStore.classList.add("hidden");
    document.getElementById("done-title").textContent = "Compte créé";
    document.getElementById("done-sub").textContent = "Tu pourras créer ta boutique plus tard depuis ton profil.";
    panelDone.classList.remove("hidden");
  });

  formStore.addEventListener("submit", function(ev){
    ev.preventDefault();
    showMsg("", "");
    var store_name = document.getElementById("store_name").value.trim();
    var category = document.getElementById("category").value;
    var description = document.getElementById("description").value.trim();

    if (!currentUserId) {
      showMsg("Confirme d'abord ton email, puis reviens créer ta boutique.", "error");
      return;
    }

    btnStore.disabled = true;
    btnStore.textContent = "Création de la boutique...";

    client.from("stores").insert({
      merchant_id: currentUserId,
      store_name: store_name,
      category: category,
      description: description,
      subscription_status: "pending"
    }).select().single()
      .then(function(res){
        if (res.error) throw res.error;
        setStep(3);
        formStore.classList.add("hidden");
        document.getElementById("done-title").textContent = "Boutique créée";
        document.getElementById("done-sub").textContent = "\"" + store_name + "\" est enregistrée. Elle sera visible dès validation de l'espace.";
        panelDone.classList.remove("hidden");
      })
      .catch(function(err){
        showMsg(translateError(err), "error");
      })
      .finally(function(){
        btnStore.disabled = false;
        btnStore.textContent = "Créer ma boutique";
      });
  });

  function translateError(err){
    var m = (err && err.message) || String(err);
    if (/already registered|already exists/i.test(m)) return "Cette adresse email a déjà un compte.";
    if (/password/i.test(m) && /short|least/i.test(m)) return "Le mot de passe est trop court (6 caractères minimum).";
    if (/row-level security|rls/i.test(m)) return "Accès refusé par la base de données. Confirme ton email puis réessaie.";
    return m;
  }
})();
</script>
