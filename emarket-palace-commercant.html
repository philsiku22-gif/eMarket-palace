<title>Espace commerçant</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: auth -> (créer boutique si aucune) -> tableau de bord à onglets Produits / Commandes */
:root{
  --bg:#f7f5f1; --surface:#ffffff; --ink:#1c1a17; --muted:#6b645c;
  --accent:#1f7a5c; --accent-ink:#ffffff; --border:#e4ddd3; --danger:#b3432f;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15130f; --surface:#211e19; --ink:#f2eee6; --muted:#a69d8f;
    --accent:#3fae84; --accent-ink:#0b1410; --border:#352f27; --danger:#e2715c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15130f; --surface:#211e19; --ink:#f2eee6; --muted:#a69d8f;
  --accent:#3fae84; --accent-ink:#0b1410; --border:#352f27; --danger:#e2715c;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); margin:0;
  font-family:"Inter",system-ui,-apple-system,sans-serif;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
.wrap{max-width:560px; margin:0 auto; padding-block:24px 56px; display:flex; flex-direction:column; gap:18px}
h1{font-family:"Space Grotesk",system-ui,sans-serif; font-size:1.4rem; margin:0}
.sub{color:var(--muted); font-size:.88rem; margin-top:2px}
.card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px; display:flex; flex-direction:column; gap:12px}
label{font-size:.82rem; font-weight:600; display:flex; flex-direction:column; gap:6px}
input,select,textarea{font:inherit; font-size:.95rem; padding:10px 12px; border-radius:9px; border:1px solid var(--border); background:var(--bg); color:var(--ink)}
textarea{resize:vertical; min-height:64px}
button{font:inherit; font-weight:600; font-size:.95rem; padding:12px 16px; border-radius:10px; border:none; background:var(--accent); color:var(--accent-ink); cursor:pointer}
button:disabled{opacity:.6; cursor:default}
button.ghost{background:transparent; color:var(--muted); border:1px solid var(--border)}
button.danger{background:transparent; color:var(--danger); border:1px solid var(--danger); padding:6px 10px; font-size:.8rem}
button.small{padding:6px 10px; font-size:.8rem}
.msg{font-size:.85rem; padding:10px 12px; border-radius:9px; border:1px solid var(--border)}
.msg.error{color:var(--danger); border-color:var(--danger)}
.msg.ok{color:var(--accent); border-color:var(--accent)}
.hidden{display:none!important}
.tabs{display:flex; gap:8px}
.tab{flex:1; text-align:center; padding:9px; border-radius:9px; font-size:.85rem; font-weight:600; cursor:pointer; color:var(--muted); border:1px solid var(--border)}
.tab.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.store-banner{display:flex; align-items:center; gap:12px}
.store-banner .badge{width:44px;height:44px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700}
.store-banner h2{margin:0; font-size:1.05rem}
.store-banner .cat{font-size:.78rem; color:var(--accent); font-weight:600}
.item-row{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--border)}
.item-row:last-child{border-bottom:none}
.item-info{min-width:0}
.item-info .name{font-weight:600; font-size:.92rem}
.item-info .meta{font-size:.78rem; color:var(--muted)}
.pill{font-size:.72rem; padding:2px 8px; border-radius:999px; border:1px solid var(--border); color:var(--muted)}
.pill.active{color:var(--accent); border-color:var(--accent)}
.actions{display:flex; gap:6px; flex:none}
.loading{color:var(--muted); font-size:.88rem; text-align:center; padding:20px}
.empty{color:var(--muted); font-size:.88rem; padding:12px 0}
footer{font-size:.78rem; color:var(--muted); text-align:center}
</style>

<div class="wrap">
  <div>
    <h1>Espace commerçant</h1>
    <div class="sub" id="header-sub">Connecte-toi pour gérer ta vitrine.</div>
  </div>

  <div id="msg-box"></div>

  <!-- AUTH -->
  <div id="view-auth" class="card">
    <div class="tabs">
      <div class="tab active" id="tab-login">Se connecter</div>
      <div class="tab" id="tab-signup">Créer un compte</div>
    </div>
    <label>Nom complet <span id="name-hint"></span>
      <input type="text" id="auth-name" placeholder="Ex. Jeanne Kalonji" class="hidden">
    </label>
    <label>Adresse email
      <input type="email" id="auth-email" placeholder="toi@exemple.com" autocomplete="email">
    </label>
    <label>Mot de passe
      <input type="password" id="auth-password" placeholder="6 caractères minimum" autocomplete="current-password">
    </label>
    <button id="btn-auth">Se connecter</button>
  </div>

  <!-- CREATE STORE -->
  <div id="view-create-store" class="card hidden">
    <div class="sub">Tu n'as pas encore de boutique. Crée-la pour commencer à vendre.</div>
    <label>Nom de la boutique
      <input type="text" id="store_name" placeholder="Ex. Chez Jeanne Mode">
    </label>
    <label>Catégorie
      <select id="store_category">
        <option value="" disabled selected>Choisis une catégorie</option>
        <option>Mode &amp; Accessoires</option>
        <option>Électronique</option>
        <option>Alimentation</option>
        <option>Beauté &amp; Soins</option>
        <option>Maison &amp; Déco</option>
        <option>Services</option>
      </select>
    </label>
    <label>Description
      <textarea id="store_description" placeholder="En quelques mots, qu'est-ce que tu vends ?"></textarea>
    </label>
    <button id="btn-create-store">Créer ma boutique</button>
  </div>

  <!-- DASHBOARD -->
  <div id="view-dashboard" class="hidden">
    <div class="card store-banner">
      <div class="badge" id="db-badge">?</div>
      <div>
        <h2 id="db-store-name"></h2>
        <div class="cat" id="db-store-cat"></div>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" id="tab-products">Produits</div>
      <div class="tab" id="tab-orders">Commandes</div>
    </div>

    <div id="panel-products">
      <div class="card" style="margin-bottom:14px">
        <div class="sub" style="margin:0 0 4px">Ajouter un produit</div>
        <label>Nom du produit <input type="text" id="p-title" placeholder="Ex. Robe wax bleue"></label>
        <label>Prix ($) <input type="number" id="p-price" min="0" step="0.01" placeholder="25"></label>
        <label>Description <textarea id="p-description" placeholder="Taille, matière, couleur..."></textarea></label>
        <button id="btn-add-product">Ajouter le produit</button>
      </div>
      <div class="card" id="products-list"><div class="loading">Chargement...</div></div>
    </div>

    <div id="panel-orders" class="hidden">
      <div class="card" id="orders-list"><div class="loading">Chargement...</div></div>
    </div>
  </div>

  <footer>eMarket-Palace &middot; connecté à la base de données en direct</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
  "use strict";
  var SUPABASE_URL = "https://dnwfbnhvxnoyosjuzxxs.supabase.co";
  var SUPABASE_KEY = "sb_publishable_oWWjQGlbhIl7FGsB5cK75w_PlNeDmpf";
  var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var mode = "login";
  var currentUser = null;
  var myStore = null;

  var msgBox = document.getElementById("msg-box");
  var headerSub = document.getElementById("header-sub");
  var viewAuth = document.getElementById("view-auth");
  var viewCreateStore = document.getElementById("view-create-store");
  var viewDashboard = document.getElementById("view-dashboard");

  function showMsg(text, kind){
    msgBox.innerHTML = "";
    if (!text) return;
    var div = document.createElement("div");
    div.className = "msg " + (kind || "");
    div.textContent = text;
    msgBox.appendChild(div);
  }

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function translateError(err){
    var m = (err && err.message) || String(err);
    if (/already registered|already exists/i.test(m)) return "Cette adresse email a déjà un compte.";
    if (/invalid login credentials/i.test(m)) return "Email ou mot de passe incorrect.";
    if (/password/i.test(m) && /short|least/i.test(m)) return "Le mot de passe est trop court (6 caractères minimum).";
    if (/row-level security|rls/i.test(m)) return "Accès refusé par la base de données.";
    return m;
  }

  // ---- AUTH ----
  document.getElementById("tab-login").addEventListener("click", function(){
    mode = "login";
    document.getElementById("tab-login").classList.add("active");
    document.getElementById("tab-signup").classList.remove("active");
    document.getElementById("auth-name").classList.add("hidden");
    document.getElementById("btn-auth").textContent = "Se connecter";
  });
  document.getElementById("tab-signup").addEventListener("click", function(){
    mode = "signup";
    document.getElementById("tab-signup").classList.add("active");
    document.getElementById("tab-login").classList.remove("active");
    document.getElementById("auth-name").classList.remove("hidden");
    document.getElementById("btn-auth").textContent = "Créer mon compte";
  });

  document.getElementById("btn-auth").addEventListener("click", function(){
    showMsg("", "");
    var name = document.getElementById("auth-name").value.trim();
    var email = document.getElementById("auth-email").value.trim();
    var password = document.getElementById("auth-password").value;
    var btn = document.getElementById("btn-auth");
    btn.disabled = true;

    var action = mode === "signup"
      ? client.auth.signUp({ email: email, password: password })
      : client.auth.signInWithPassword({ email: email, password: password });

    action.then(function(res){
        if (res.error) throw res.error;
        var user = res.data && res.data.user;
        if (!user) throw new Error("Vérifie ton email pour confirmer ton compte avant de te connecter.");
        currentUser = user;
        if (mode === "signup"){
          return client.from("profiles").upsert({ id: user.id, full_name: name || email.split("@")[0], role: "merchant" });
        }
      })
      .then(function(){
        headerSub.textContent = "Connecté comme " + email;
        viewAuth.classList.add("hidden");
        loadMyStore();
      })
      .catch(function(err){ showMsg(translateError(err), "error"); })
      .finally(function(){ btn.disabled = false; });
  });

  // ---- STORE ----
  function loadMyStore(){
    client.from("stores").select("*").eq("merchant_id", currentUser.id).limit(1).maybeSingle()
      .then(function(res){
        if (res.error) throw res.error;
        myStore = res.data;
        if (!myStore){
          viewCreateStore.classList.remove("hidden");
        } else {
          showDashboard();
        }
      })
      .catch(function(err){ showMsg(translateError(err), "error"); });
  }

  document.getElementById("btn-create-store").addEventListener("click", function(){
    showMsg("", "");
    var store_name = document.getElementById("store_name").value.trim();
    var category = document.getElementById("store_category").value;
    var description = document.getElementById("store_description").value.trim();
    var btn = document.getElementById("btn-create-store");
    btn.disabled = true;

    client.from("stores").insert({
      merchant_id: currentUser.id,
      store_name: store_name,
      category: category,
      description: description,
      subscription_status: "pending"
    }).select().single()
      .then(function(res){
        if (res.error) throw res.error;
        myStore = res.data;
        viewCreateStore.classList.add("hidden");
        showDashboard();
      })
      .catch(function(err){ showMsg(translateError(err), "error"); })
      .finally(function(){ btn.disabled = false; });
  });

  function showDashboard(){
    viewDashboard.classList.remove("hidden");
    document.getElementById("db-badge").textContent = (myStore.store_name || "?").trim().charAt(0).toUpperCase();
    document.getElementById("db-store-name").textContent = myStore.store_name;
    document.getElementById("db-store-cat").textContent = myStore.category;
    loadProducts();
  }

  // ---- PRODUCTS TAB ----
  document.getElementById("tab-products").addEventListener("click", function(){
    document.getElementById("tab-products").classList.add("active");
    document.getElementById("tab-orders").classList.remove("active");
    document.getElementById("panel-products").classList.remove("hidden");
    document.getElementById("panel-orders").classList.add("hidden");
  });
  document.getElementById("tab-orders").addEventListener("click", function(){
    document.getElementById("tab-orders").classList.add("active");
    document.getElementById("tab-products").classList.remove("active");
    document.getElementById("panel-orders").classList.remove("hidden");
    document.getElementById("panel-products").classList.add("hidden");
    loadOrders();
  });

  document.getElementById("btn-add-product").addEventListener("click", function(){
    showMsg("", "");
    var title = document.getElementById("p-title").value.trim();
    var price = parseFloat(document.getElementById("p-price").value);
    var description = document.getElementById("p-description").value.trim();
    if (!title || isNaN(price)){
      showMsg("Donne au moins un nom et un prix valides.", "error");
      return;
    }
    var btn = document.getElementById("btn-add-product");
    btn.disabled = true;

    client.from("products").insert({
      store_id: myStore.id,
      title: title,
      price: price,
      description: description,
      is_active: true
    })
      .then(function(res){
        if (res.error) throw res.error;
        document.getElementById("p-title").value = "";
        document.getElementById("p-price").value = "";
        document.getElementById("p-description").value = "";
        loadProducts();
      })
      .catch(function(err){ showMsg(translateError(err), "error"); })
      .finally(function(){ btn.disabled = false; });
  });

  function loadProducts(){
    var area = document.getElementById("products-list");
    area.innerHTML = '<div class="loading">Chargement...</div>';
    client.from("products").select("*").eq("store_id", myStore.id).order("created_at", { ascending: false })
      .then(function(res){
        if (res.error) throw res.error;
        var products = res.data || [];
        if (products.length === 0){
          area.innerHTML = '<div class="empty">Aucun produit encore. Ajoute le premier ci-dessus.</div>';
          return;
        }
        area.innerHTML = "";
        products.forEach(function(p){
          var row = document.createElement("div");
          row.className = "item-row";
          var price = Number(p.price);
          row.innerHTML =
            '<div class="item-info">' +
              '<div class="name">' + escapeHtml(p.title) + '</div>' +
              '<div class="meta">' + (isNaN(price) ? "" : price.toLocaleString("fr-FR") + " $") + '</div>' +
            '</div>';
          var actions = document.createElement("div");
          actions.className = "actions";
          var togglePill = document.createElement("span");
          togglePill.className = "pill" + (p.is_active ? " active" : "");
          togglePill.textContent = p.is_active ? "En ligne" : "Masqué";
          togglePill.style.cursor = "pointer";
          togglePill.addEventListener("click", function(){
            client.from("products").update({ is_active: !p.is_active }).eq("id", p.id)
              .then(function(res2){ if (res2.error) throw res2.error; loadProducts(); })
              .catch(function(err){ showMsg(translateError(err), "error"); });
          });
          var delBtn = document.createElement("button");
          delBtn.className = "danger";
          delBtn.textContent = "Supprimer";
          delBtn.addEventListener("click", function(){
            client.from("products").delete().eq("id", p.id)
              .then(function(res2){ if (res2.error) throw res2.error; loadProducts(); })
              .catch(function(err){ showMsg(translateError(err), "error"); });
          });
          actions.appendChild(togglePill);
          actions.appendChild(delBtn);
          row.appendChild(actions);
          area.appendChild(row);
        });
      })
      .catch(function(err){
        area.innerHTML = '<div class="empty">Erreur : ' + escapeHtml(err.message || err) + '</div>';
      });
  }

  // ---- ORDERS TAB ----
  function loadOrders(){
    var area = document.getElementById("orders-list");
    area.innerHTML = '<div class="loading">Chargement...</div>';
    client.from("order_items")
      .select("quantity, unit_price, products!inner(title, store_id), orders(status, created_at, payment_method)")
      .eq("products.store_id", myStore.id)
      .then(function(res){
        if (res.error) throw res.error;
        var rows = res.data || [];
        if (rows.length === 0){
          area.innerHTML = '<div class="empty">Aucune commande reçue pour l\'instant.</div>';
          return;
        }
        area.innerHTML = "";
        rows.forEach(function(r){
          var row = document.createElement("div");
          row.className = "item-row";
          var lineTotal = Number(r.unit_price) * r.quantity;
          var status = r.orders ? r.orders.status : "inconnu";
          var date = r.orders && r.orders.created_at ? new Date(r.orders.created_at).toLocaleDateString("fr-FR") : "";
          row.innerHTML =
            '<div class="item-info">' +
              '<div class="name">' + escapeHtml(r.products.title) + ' &times; ' + r.quantity + '</div>' +
              '<div class="meta">' + lineTotal.toLocaleString("fr-FR") + ' $ &middot; ' + date + '</div>' +
            '</div>' +
            '<span class="pill' + (status === "paid" ? " active" : "") + '">' + escapeHtml(statusLabel(status)) + '</span>';
          area.appendChild(row);
        });
      })
      .catch(function(err){
        area.innerHTML = '<div class="empty">Erreur : ' + escapeHtml(err.message || err) + '</div>';
      });
  }

  function statusLabel(s){
    return { paid: "Payée", preparing: "En préparation", shipped: "Expédiée", delivered: "Livrée", cancelled: "Annulée" }[s] || s;
  }
})();
</script>
